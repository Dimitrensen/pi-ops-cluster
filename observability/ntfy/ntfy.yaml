apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: monitoring
  labels:
    app: ntfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      nodeSelector:
        kubernetes.io/hostname: argo-pi
      containers:
        - name: ntfy
          image: docker.io/binwiederhier/ntfy:v2.11.3
          args: ["serve", "--listen-http", ":80"]
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: monitoring
  labels:
    app: ntfy
spec:
  type: NodePort
  selector:
    app: ntfy
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30880
